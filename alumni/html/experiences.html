<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnisce</title>
    <link rel="stylesheet" href="../css/experiences.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="brand-logo">
                <i class="fas fa-graduation-cap"></i> ALUMNISCE
            </div>
            <ul class="nav-links">
                <li><a href="../html/homepage.html">HOME</a></li>
                <li><a href="../html/alumni.html">ALUMNUS</a></li>
                <li><a href="../html/events.html">EVENTS</a></li>
                <li><a href="../html/opportunities.html">OPPORTUNITIES</a></li>
                <li><a href="../html/experiences.html">EXPERIENCES</a></li>
            </ul>
            <div class="search-profile">
                <div class="profile-icon-container">
                    <a href="../html/profile.html" class="profile-icon" title="Profile"><i class="fas fa-user-circle"></i></a>
                    <div class="dropdown-content">
                        <a href="../html/profile.html">View Profile</a>
                        <a href="#" id="logout-link">Logout</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="main-content">
        <header>
            <h1>ALUMNUS Experience</h1>
            <div class="actions">
                <button class="btn" id="add-experience-btn">
                  <img src="../img/add.png" alt="Add Icon" class="button-icon"> Add New Experience 
                </button>
                <button class="btn" id="filter-button">
                  <img src="../img/FilterIcon.svg" alt="Filter Icon" class="button-icon"> Filter
                </button>
            </div>
        </header>

        <div class="search-bar">
            <input type="text" placeholder="Search" id="search-input">
            <button id="search-button" class="search-btn">
                <img src="../img/SearchIcon.svg" alt="Search Icon">
            </button>
        </div>

        <div class="experience-list">
            <!-- Dynamic experience cards will be rendered here -->
            <p>Loading experiences...</p>
        </div>
    </div>

    <!-- Comment Pop-up -->
    <div class="comment-popup hidden">
      <div class="popup-content">
        <button class="close-btn">✖</button>
        <h2>Comments</h2>

        <div class="comment-list">
          <!-- Comments will be dynamically loaded here -->
        </div>

        <textarea class="comment-input" placeholder="Write a comment..." rows="3"></textarea>
        <button class="submit-comment-btn">Submit</button>
      </div>
    </div>

    <!-- Add Experience Modal -->
    <div class="modal-overlay hidden">
      <div class="modal">
        <h2>Add New Experience</h2>
        <form id="add-experience-form">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="Enter title" required />

          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Enter description" required></textarea>

          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="Ghost Tales">Ghost Tales</option>
            <option value="OSA Stories">OSA Stories</option>
            <option value="Library Stories">Library Stories</option>
          </select>

          <label for="image-file">Image File</label>
          <input type="file" id="image-file" name="image-file" accept="image/*" />

          <div class="modal-actions">
            <button type="button" id="cancel-btn">Cancel</button>
            <button type="submit" id="add-btn">Add</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Filter Pop-up -->
    <div id="filterPopup" class="popup-overlay hidden">
      <div class="popup-content">
        <h2>Filter Options</h2>
        
        <div class="filter-group">
          <label for="sortByDate">Sort by Date:</label>
          <select id="sortByDate">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterCategory">Filter by Category:</label>
          <select id="filterCategory">
            <option value="all">All Categories</option>
            <option value="Ghost Tales">Ghost Tales</option>
            <option value="OSA Stories">OSA Stories</option>
            <option value="Library Stories">Library Stories</option>
          </select>
        </div>
        <div class="popup-actions">
          <button class="btn cancel-btn" onclick="closeFilterPopup()">Cancel</button>
          <button class="btn apply-btn">Apply</button>
        </div>
      </div>
    </div>

    <!-- External JavaScript Files -->
    <script src="../js/experiences.js"></script>
    <script src="../js/homepage.js"></script>
</body>
</html>
