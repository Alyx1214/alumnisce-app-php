<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnisce</title>
    <link rel="stylesheet" href="../css/homepage.css">
    <link rel="stylesheet" href="../css/searchFilter.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="brand-logo">
                <i class="fas fa-graduation-cap"></i> ALUMNISCE
            </div>
            <ul class="nav-links">
                <li><a href="../html/homepage.html">HOME</a></li>
                <li><a href="../html/alumni.html">ALUMNUS</a></li>
                <li><a href="../html/events.html">EVENTS</a></li>
                <li><a href="../html/opportunities.html">OPPORTUNITIES</a></li>
                <li><a href="../html/experiences.html">EXPERIENCES</a></li>
            </ul>
            <div class="search-profile">
                <div class="profile-icon-container">
                    <a href="../html/profile.html" class="profile-icon" title="Profile"><i class="fas fa-user-circle"></i></a>
                    <div class="dropdown-content">
                        <a href="../html/profile.html">View Profile</a>
                        <a href="#logout">Logout</a>
                    </div>
                </div>
            </div>
        </nav>


  <!-- Filter Section -->
    <div class="filter-section">
        <label for="school">School/Program:</label>
        <select id="school" onchange="updateCourses(this.value)">
            <option value="">--Select School--</option>
            <option value="SAMCIS">SAMCIS</option>
            <option value="SEA">SEA</option>
            <option value="SONAHBS">SONAHBS</option>
            <option value="STELA">STELA</option>
            <option value="SOL">SOL</option>
            <option value="SOM">SOM</option>
            <option value="SAS">SAS</option>
        </select>

        <label for="course">Course:</label>
        <select id="course">
            <option value="">--Select Course--</option>
        </select>

        <label for="batch">Batch:</label>
        <input type="text" id="batch" placeholder="Enter Batch">

        <button onclick="applyFilters()">Apply Filters</button>
        <button onclick="resetFilters()">Reset Filters</button>
    </div>

    <!-- Search Results -->
    <div id="search-results"></div>

    <script src="../js/searchFilter.js"></script>
</body>
</html>
