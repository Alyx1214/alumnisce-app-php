<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnisce</title>
    <link rel="stylesheet" href="../css/editprofile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="brand-logo">
                <i class="fas fa-graduation-cap"></i> ALUMNISCE
            </div>
            <ul class="nav-links">
                <li><a href="../html/homepage.html">HOME</a></li>
                <li><a href="../html/alumni.html">ALUMNUS</a></li>
                <li><a href="../html/events.html">EVENTS</a></li>
                <li><a href="../html/opportunities.html">OPPORTUNITIES</a></li>
                <li><a href="../html/experiences.html">EXPERIENCES</a></li>
            </ul>
            <div class="search-profile">
                <div class="profile-icon-container">
                    <a href="../html/profile.html" class="profile-icon" title="Profile"><i class="fas fa-user-circle"></i></a>
                </div>
            </div>
        </nav>
    </header>

    <div class="container">
        <h2>Edit Profile</h2>
        <form id="edit-profile-form">
            <div class="edit-profile-section">
                <div class="profile-picture-container">
                    <div class="profile-picture">
                        <img src="../images/default.jpg" alt="Profile Picture" id="profile-img">
                    </div>
                    <input type="file" id="profile-picture" accept="image/*" class="file-input">
                    <label for="profile-picture" class="file-input-label">Choose a new picture</label>
                </div>
            </div>

            <div class="edit-profile-section">
                <label for="first-name">First Name</label>
                <div class="input-container">
                    <input type="text" id="first-name" value="Current First Name">
                </div>
            </div>
            
            <div class="edit-profile-section">
                <label for="last-name">Last Name</label>
                <div class="input-container">
                    <input type="text" id="last-name" value="Current Last Name">
                </div>
            </div>            

            <div class="edit-profile-section">
                <label for="email">Email</label>
                <div class="input-container">
                    <input type="text" id="email" value="current.email@example.com" name="email">
                </div>
            </div>

            <div class="edit-profile-section">
                <label for="bio">Bio</label>
                <div class="input-container">
                    <textarea id="bio" name="bio">Current Bio</textarea>
                </div>
            </div>

            <div class="edit-profile-section">
                <label for="program">Program</label>
                <div class="input-container">
                    <input type="text" id="program" value="Current Program">
                </div>
            </div>

            <div class="edit-profile-section">
                <label for="skills">Skills</label>
                <div class="skills-container">
                    <!-- Skills will be dynamically inserted here -->
                    <button type="button" class="add-skill-btn">Add Skill</button>
                </div>
            </div>

            <div class="edit-profile-section">
                <label for="experience">Experience</label>
                <div class="experience-container">
                    <div class="experience-section">
                        <!-- Experiences dynamically inserted here -->
                    </div>
                    <button type="button" class="add-experience-btn">Add Experience</button>
                </div>
            </div>

            <!-- Templates -->
            <div id="skill-template" style="display: none;">
                <div class="skill-item">
                    <input type="text" placeholder="Enter skill">
                    <button type="button" class="remove-btn" title="Remove Skill">✖</button>
                </div>
            </div>

            <div id="experience-template" style="display: none;">
                <div class="experience-item">
                    <h4><input type="text" class="company-input" placeholder="Company Name" name="company"></h4>
                    <p><input type="text" class="duration-input" placeholder="Duration" name="duration"></p>
                    <p><input type="text" class="location-input" placeholder="Location" name="location"></p>
                    <p><input type="text" class="role-input" placeholder="Role" name="role"></p>
                    <p><textarea class="description-input" placeholder="Description of the experience." name="description"></textarea></p>
                    <button type="button" class="remove-btn" title="Remove Experience">✖</button>
                </div>
            </div>

            <div class="edit-profile-section">
                <label for="linked-accounts">Linked Accounts</label>
                <div class="linked-accounts-container">
                    <!-- Linked accounts dynamically inserted here -->
                    <button type="button" class="add-account-btn">Add Account</button>
                </div>
            </div>            

            <div class="button-container">
                <button type="submit" class="save-btn">Save Changes</button>
                <button type="button" class="cancel-btn" onclick="redirectToProfile()">Cancel</button>
            </div>
        </form>
    </div>

    <script src="../js/editprofile.js"></script>
</body>
</html>
